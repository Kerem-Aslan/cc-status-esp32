; Claude Code Status Light - ESP32-WROOM-32 (DevKit V1)
; Build:  pio run        USB upload:  pio run -t upload        Serial monitor:  pio device monitor
; WiFi upload (OTA):     pio run -e ota -t upload

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; 921600 sometimes fails on CH340-based clone boards; 460800 is safe.
upload_speed = 460800

; Manual download mode: hold BOOT, tap EN, release BOOT, then upload.
; By default esptool resets the board right before flashing, which kicks it back out of
; download mode on boards where you enter it by hand. no_reset makes esptool connect to
; the board as it is. After flashing it still resets so the new firmware starts.
; If your board's auto-reset works (no buttons needed), delete this line.
board_upload.before_reset = no_reset

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.12.1

; Over-the-air update: flashes over WiFi, no USB cable needed.
; The board must already be running OTA-capable firmware (flash it once over USB).
; If the IP changes, update custom_ota_ip.
; (The IP is kept in a custom option, not upload_port: an IP in upload_port makes
; PlatformIO print a misleading "switched to espota" warning.)
[env:ota]
extends = env:esp32dev
upload_protocol = custom
custom_ota_ip = 192.168.1.50
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File tools/Flash-Ota.ps1 -Ip ${env:ota.custom_ota_ip} -Bin $SOURCE
